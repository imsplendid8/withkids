name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # @nestjs/bull·@nestjs/schedule이 ESM 전용이라 require(esm)이 기본으로 켜진
        # Node 20.19+ / 22.12+ 에서만 API가 실행된다.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: withdkis_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/withdkis_dev
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_ci_password
      JWT_SECRET: ci-only-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      # 서비스 컨테이너로는 redis-server 인자(--requirepass)를 넘길 수 없어 직접 띄운다.
      - name: Start Redis
        run: |
          docker run -d --name redis -p 6379:6379 redis:7-alpine redis-server --requirepass "$REDIS_PASSWORD"
          for i in $(seq 1 20); do
            docker exec redis redis-cli -a "$REDIS_PASSWORD" ping 2>/dev/null | grep -q PONG && exit 0
            sleep 1
          done
          echo "Redis did not become ready" && exit 1

      - name: Install dependencies
        run: npm ci

      - name: E2E tests (Postgres + Redis)
        run: npm run test:e2e

  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # compose 파일이 필수 비밀값을 요구한다. 이미지 빌드에는 쓰이지 않으므로 더미값을 준다.
      - name: Build Docker images
        run: docker compose build
        env:
          DOCKER_BUILDKIT: 1
          POSTGRES_PASSWORD: ci
          REDIS_PASSWORD: ci
          JWT_SECRET: ci
